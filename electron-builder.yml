appId: org.drmeow.desktop
productName: Dr. Meow
directories:
  app: .
  output: release
files:
  - dist/**/*
  - '!dist/native/**'
  - package.json
asar: true
mac:
  target:
    - dmg
    - zip
  category: public.app-category.lifestyle
  icon: public/assets/app.png
  artifactName: Dr-Meow-${version}-mac-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: x64
  icon: public/assets/app.ico
  signExecutable: false
  extraResources:
    - from: dist/native/FullscreenProbe.exe
      to: native/FullscreenProbe.exe
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: scripts/installer.nsh
artifactName: Dr-Meow-Upgrade-${version}-${arch}.${ext}

